# RichMP3 example configuration.
# Copy to ./richmp3.toml or ~/.config/richmp3/config.toml, then edit.
# Every value here is optional. The output example is for Termux;
# elsewhere RichMP3 defaults to ./downloads.

output = "~/storage/shared/Download" # Android Download folder in Termux
bitrate = 24
vbr_quality = 7
sample_rate = 11025
format = "mp3"        # mp3 | opus
audio_language = "original" # original, or a code such as en or ar
mode = "vbr"          # vbr | abr | cbr (MP3 only; Opus is always VBR)
voice_filter = true   # highpass/lowpass at <=16 kHz for clearer voice

download_workers = 8
convert_workers = 8
playlist = true
zip = true
zip_method = "stored" # stored | deflate
keep_folder = false   # delete the source folder after a successful zip

cookies = ""          # e.g. "~/cookies.txt"
limit_rate = ""       # e.g. "500k"
js_runtime = "auto"   # auto | deno | node | bun | quickjs
remote_components = false  # allow yt-dlp's EJS solver for better YouTube formats
retries = 3
number_width = 0      # 0 = auto, minimum 4 digits
overwrite = false
timeout = 30
concurrent_fragments = 16
log_file = ""         # e.g. "~/richmp3.log"
no_ui = false
